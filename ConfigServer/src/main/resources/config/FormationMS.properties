# FormationMS Configuration
spring.application.name=FormationMS
server.port=8081
welcome.message=Welcome to Formation MS from Config Server

# --- JPA Configuration ---
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true

# --- Logging Configuration ---
logging.level.tic.alma.formationms=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# --- Management & Monitoring ---
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# --- Application Specific Properties ---
formation.service.name=Formation Service
formation.service.version=1.0.0
formation.service.description=Microservice for managing formations and resources
 # QuizMS Configuration
spring.application.name=Quiz
server.port=9090

# --- Eureka Client Configuration ---
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true

# --- JPA Configuration ---
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true

# --- Logging Configuration ---
logging.level.microservice.quiz=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=DEBUG

# --- Management & Monitoring ---
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# --- Application Specific Properties ---
quiz.service.name=Quiz Service
quiz.service.version=1.0.0
quiz.service.description=Microservice for managing quizzes and evaluations
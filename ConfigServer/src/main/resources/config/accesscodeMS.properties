# AccessCodeMS Configuration
spring.application.name=accesscodeMS
server.port=9098

# --- JPA Configuration ---
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true

# --- Logging Configuration ---
logging.level.microservice.accesscode=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=DEBUG

# --- Management & Monitoring ---
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# --- Application Specific Properties ---
accesscode.service.name=Access Code Service
accesscode.service.version=1.0.0
accesscode.service.description=Microservice for managing access codes
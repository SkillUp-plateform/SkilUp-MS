# ProjetMS Configuration
spring.application.name=projetMS
server.port=8083


# --- JPA Configuration ---
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true

# --- Eureka Client Configuration ---
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true

# --- Cloud Config ---
spring.cloud.config.enabled=true
spring.config.import=optional:configserver:http://localhost:8888

# --- Logging Configuration ---
logging.level.com.esprit.microservice.projet=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=DEBUG

# --- Management & Monitoring ---
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# --- Application Specific Properties ---
projet.service.name=Project Service
projet.service.version=1.0.0
projet.service.description=Microservice for managing projects
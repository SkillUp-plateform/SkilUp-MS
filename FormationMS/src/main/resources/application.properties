spring.application.name=FormationMS
server.port=8081
welcome.message= Welcome to Formation MS

# --- Configuration base de données H2 ---
spring.datasource.url=jdbc:h2:mem:formationdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update

# --- Console H2 (interface web) ---
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Enregistrement auprès du serveur Eureka
eureka.client.service-url.default-zone=http://localhost:8761/eureka
eureka.instance.prefer-ip-address=true

# Config Client
spring.cloud.config.enabled=true
spring.config.import=optional:configserver:http://localhost:8888

# Spring RabbitMQ
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

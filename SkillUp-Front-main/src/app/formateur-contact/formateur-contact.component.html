<app-side-bar-user (toggle)="onSidebarToggle($event)"></app-side-bar-user>

<div class="main-content" [class.collapsed]="isSidebarCollapsed">
    <div class="container">
        <div class="row align-items-center mb-3">
            <div class="col-md-6">
                <h5 class="card-title">Formateurs</h5>
            </div>
        </div>
        <div class="row">
            <!-- Formateur cards -->
            <div class="col-xl-3 col-lg-4 col-md-6 col-sm-12 mb-4" *ngFor="let contact of Formateurs">
                <div class="card formateur-card h-100 shadow-sm">
                    <div class="card-body text-center">
                        <div class="mb-3">
                            <img *ngIf="imageMap.has(contact.id)" 
                                 [src]="getImageUrl(imageMap.get(contact.id))" 
                                 alt="Formateur" 
                                 class="rounded-circle img-thumbnail" 
                                 style="width: 100px; height: 100px; object-fit: cover;" />
                            <div *ngIf="!imageMap.has(contact.id)" 
                                 class="rounded-circle bg-primary text-white d-inline-flex align-items-center justify-content-center"
                                 style="width: 100px; height: 100px; font-size: 2rem;">
                                {{ contact.username.charAt(0).toUpperCase() }}
                            </div>
                        </div>
                        
                        <h5 class="card-title mb-2">
                            <strong>{{ contact.username }}</strong>
                        </h5>
                        
                        <p class="text-muted mb-1" *ngIf="contact.firstname || contact.lastname">
                            <small>{{ contact.firstname }} {{ contact.lastname }}</small>
                        </p>
                        
                        <p class="mb-3" *ngIf="contact.speciality">
                            <span class="badge bg-info text-dark">{{ contact.speciality }}</span>
                        </p>
                        
                        <div class="mt-3">
                            <p class="text-muted mb-2 d-flex align-items-center justify-content-center" style="font-size: 14px;">
                                <i class="fas fa-envelope me-2 text-primary"></i>
                                <a [href]="'mailto:' + contact.email" 
                                   class="text-decoration-none text-muted">
                                   {{ contact.email }}
                                </a>
                            </p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

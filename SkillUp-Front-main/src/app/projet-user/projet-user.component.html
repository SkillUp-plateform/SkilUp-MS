<div class="container-fluid p-0">
  <app-side-bar-user (toggle)="onSidebarToggle($event)"></app-side-bar-user>

  <div class="main-content p-4" [class.collapsed]="isSidebarCollapsed">
    <div class="container-fluid">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="h3 fw-bold text-primary mb-0">
          <i class="bx bx-folder"></i> Projets
        </h1>
        <span class="badge bg-primary fs-6">{{ Projects.length }} projets</span>
      </div>

      <div class="row g-4">
        <div
          class="col-12 col-md-6 col-lg-4"
          *ngFor="let projet of Projects; let i = index"
        >
          <div class="card shadow-sm border-0 project-card h-100">
            <div class="card-body d-flex flex-column">
              <h5 class="card-title text-dark fw-bold mb-2">
                <i class="bx bx-briefcase me-2 text-primary"></i>
                {{ projet.title }}
              </h5>

              <!-- Si le projet n’est pas étendu -->
              <p class="card-text text-muted flex-grow-1" *ngIf="expandedProjectIndex !== i">
                {{ projet.description | slice:0:100 }}
                <span *ngIf="projet.description.length > 100">...</span>
              </p>

              <!-- Description complète si étendu -->
              <p class="card-text text-muted flex-grow-1" *ngIf="expandedProjectIndex === i">
                {{ projet.description }}
              </p>

              <div class="mt-3 text-end">
                <button
                  class="btn btn-sm btn-outline-primary"
                  (click)="toggleDetails(i)"
                >
                  <i class="bx bx-show"></i>
                  {{ expandedProjectIndex === i ? 'Réduire' : 'Voir détails' }}
                </button>
              </div>
            </div>
          </div>
        </div>

        <!-- Si aucun projet -->
        <div *ngIf="Projects.length === 0" class="text-center py-5">
          <img
            src="https://cdn-icons-png.flaticon.com/512/4076/4076500.png"
            alt="Aucun projet"
            width="120"
            class="mb-3 opacity-75"
          />
          <h5 class="text-muted">Aucun projet disponible pour le moment</h5>
        </div>
      </div>
    </div>
  </div>
</div>

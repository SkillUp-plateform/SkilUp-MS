<div class="card">
  <h2>Soumettre une candidature</h2>

  <form (ngSubmit)="submit()">
    <div class="form-group">
      <label>User ID</label>
      <input type="number" class="form-control" [(ngModel)]="userId" name="userId" required />
    </div>

    <div class="form-group">
      <label>Motivation (facultatif)</label>
      <textarea class="form-control" [(ngModel)]="motivation" name="motivation" rows="4"></textarea>
    </div>

    <div class="form-group">
      <label>CV (PDF) — facultatif</label>
      <input type="file" class="form-control" (change)="onFileChange($event)" accept="application/pdf" />
    </div>

    <button class="btn btn-primary" type="submit" [disabled]="submitting">Envoyer</button>
  </form>

  <div class="mt-3" *ngIf="error" style="color: #c00;">
    {{ error }}
  </div>

  <div class="mt-3" *ngIf="result">
    <h3>Candidature créée</h3>
    <p>ID: {{ result.id }} | Statut: {{ result.status }}</p>
    <p>Motivation: {{ result.motivation || '—' }}</p>
    <button class="btn btn-secondary" (click)="downloadCv()" [disabled]="!result.cvPath">Télécharger le CV</button>
  </div>
</div>

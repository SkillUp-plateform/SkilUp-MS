<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Authentication Flow</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .test-section { margin: 20px 0; padding: 15px; border: 1px solid #ccc; }
        .success { color: green; }
        .error { color: red; }
        .log { background: #f5f5f5; padding: 10px; margin: 10px 0; font-family: monospace; }
    </style>
</head>
<body>
    <h1>Authentication Flow Test</h1>
    
    <div class="test-section">
        <h2>1. Test User Registration</h2>
        <button onclick="testUserRegistration()">Test User Registration</button>
        <div id="registration-log"></div>
    </div>
    
    <div class="test-section">
        <h2>2. Test User Login</h2>
        <button onclick="testUserLogin()">Test User Login</button>
        <div id="login-log"></div>
    </div>
    
    <div class="test-section">
        <h2>3. Test Keycloak Connection</h2>
        <button onclick="testKeycloakConnection()">Test Keycloak Connection</button>
        <div id="keycloak-log"></div>
    </div>

    <script src="js/main.js"></script>
    <script>
        function log(elementId, message, isError = false) {
            const logDiv = document.getElementById(elementId);
            const logEntry = document.createElement('div');
            logEntry.className = isError ? 'log error' : 'log success';
            logEntry.textContent = new Date().toLocaleTimeString() + ' - ' + message;
            logDiv.appendChild(logEntry);
        }

        async function testUserRegistration() {
            log('registration-log', 'Starting user registration test...');
            
            try {
                const userData = {
                    username: 'testuser2',
                    email: 'testuser2@example.com',
                    password: 'password123',
                    fullName: 'Test User 2',
                    roles: ['user']
                };
                
                log('registration-log', 'Sending registration request to Python API...');
                
                const response = await fetch('http://localhost:8089/users', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(userData)
                });
                
                const result = await response.json();
                
                if (response.ok) {
                    log('registration-log', 'Registration successful: ' + result.message);
                    log('registration-log', 'Keycloak ID: ' + result.keycloak_id);
                } else {
                    log('registration-log', 'Registration failed: ' + JSON.stringify(result), true);
                }
            } catch (error) {
                log('registration-log', 'Registration error: ' + error.message, true);
            }
        }

        async function testUserLogin() {
            log('login-log', 'Starting user login test...');
            
            try {
                const loginData = {
                    username: 'testuser',
                    password: 'password123',
                    client_id: 'admin-cli',
                    grant_type: 'password'
                };
                
                log('login-log', 'Sending login request to Keycloak...');
                
                const formData = new URLSearchParams();
                formData.append('username', loginData.username);
                formData.append('password', loginData.password);
                formData.append('client_id', loginData.client_id);
                formData.append('grant_type', loginData.grant_type);
                
                const response = await fetch('http://localhost:8080/realms/my-app-realm/protocol/openid-connect/token', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded'
                    },
                    body: formData
                });
                
                const result = await response.json();
                
                if (response.ok) {
                    log('login-log', 'Login successful!');
                    log('login-log', 'Access token received: ' + result.access_token.substring(0, 50) + '...');
                } else {
                    log('login-log', 'Login failed: ' + JSON.stringify(result), true);
                }
            } catch (error) {
                log('login-log', 'Login error: ' + error.message, true);
            }
        }

        async function testKeycloakConnection() {
            log('keycloak-log', 'Testing Keycloak connection...');
            
            try {
                const response = await fetch('http://localhost:8080/realms/my-app-realm/.well-known/openid-configuration');
                
                if (response.ok) {
                    const config = await response.json();
                    log('keycloak-log', 'Keycloak is accessible!');
                    log('keycloak-log', 'Token endpoint: ' + config.token_endpoint);
                } else {
                    log('keycloak-log', 'Keycloak connection failed: ' + response.status, true);
                }
            } catch (error) {
                log('keycloak-log', 'Keycloak connection error: ' + error.message, true);
            }
        }
    </script>
</body>
</html>

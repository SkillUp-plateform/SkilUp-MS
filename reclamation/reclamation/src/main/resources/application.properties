spring.application.name=reclamationMS
server.port=8086
welcome.message= Welcome to reclamation MS

# --- Configuration base de données H2 ---
spring.datasource.url=jdbc:h2:mem:reclamationdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update

# --- Console H2 (interface web) ---
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
#Logging
logging.level.root = info
logging.pattern.console= %d{yyyy-MM-dd HH:mm:ss} -%level -%logger{60} %msg %n


# Enregistrement auprès du serveur Eureka
eureka.client.service-url.default-zone=http://localhost:8761/eureka
eureka.instance.prefer-ip-address=true

# Config Client
spring.cloud.config.enabled=true
spring.config.import=optional:configserver:http://localhost:8888

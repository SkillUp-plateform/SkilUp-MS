# ===============================
# 🔧 Configuration du serveur
# ===============================
server.port=9085

spring.application.name=recrutementMS

# ===============================
# 💾 Configuration de la base de données MySQL
# ===============================
spring.datasource.url=jdbc:mysql://localhost:3306/recrutementDB?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=

spring.cloud.config.enabled=true
spring.config.import=optional:configserver:http://localhost:8888

# ===============================
# ⚙️ Configuration Hibernate / JPA
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# ===============================
# 🧩 Configuration JSON
# ===============================
spring.jackson.serialization.FAIL_ON_EMPTY_BEANS=false

# ===============================
# 🕵️ Logging (facultatif)
# ===============================
logging.level.org.springframework=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# ===============================
# 🔔 Communication avec d'autres microservices (exemple)
# ===============================
# Exemple : l'URL du microservice Notification en Symfony (quand il sera prêt)
# notification.service.url=http://localhost:8000/api/notifications

spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB
app.upload.cv-dir=uploads/cv
